security:
    - oauth: []
components:
    securitySchemes:
        oauth:
            type: oauth2
            flows:
                clientCredentials:
                    tokenUrl: https://api.eventdrive.com/public/v1/token
                    scopes: {}
    responses:
        200:
            description: OK
            content:
                application/json: {}
        400:
            description: Bad Request
        401:
            description: Unauthorized
        403:
            description: Forbidden
        404:
            description: Not Found
    schemas:
        Organization:
            type: object
            required:
                - email
                - first_name
                - last_name
            properties:
                id:
                    type: integer
                    format: int32
                name:
                    type: string
                slug:
                    type: string
                branding:
                    type: object
                    properties:
                        color:
                            type: string
                        icon_url:
                            type: string
                        logo_url:
                            type: string
                        background_image_url:
                            type: string
                        promo_image_url:
                            type: string
        Attendee:
            type: object
            required:
                - email
                - first_name
                - last_name
            properties:
                id:
                    type: integer
                    format: int32
                external_id:
                    type: string
                email:
                    type: string
                    format: email
                first_name:
                    type: string
                last_name:
                    type: string
                company:
                    type: string
                job_title:
                    type: string
                avatar_url:
                    type: string
                biography:
                    type: string
                country_code:
                    type: string
                    example: FR
                country_name:
                    type: string
                location:
                    type: string
                phone_number:
                    type: string
                facebook_url:
                    type: string
                    format: uri
                    example: 'https://www.facebook.com/#'
                linkedin_url:
                    type: string
                    format: uri
                    example: 'https://www.linkedin.com/in/#'
                twitter_url:
                    type: string
                    format: uri
                    example: 'https://twitter.com/#'
                website_url:
                    type: string
                    format: uri
                is_unsubscribe:
                    type: boolean
                extra_fields:
                    type: object
                created_at:
                    type: string
                    format: date-time
                    readOnly: true
                updated_at:
                    type: string
                    format: date-time
                    readOnly: true
        Event:
            type: object
            required:
                - name
                - start_date
                - end_date
                - timezone
            properties:
                id:
                    type: integer
                    format: int32
                external_id:
                    type: string
                main_manager_id:
                    type: integer
                    format: int32
                additional_manager_id:
                    type: array
                    items:
                        type: string
                event_template_id:
                    type: string
                    writeOnly: true
                is_template:
                    type: boolean
                    readOnly: true
                    example: false
                category_id:
                    type: integer
                    format: int32
                category_ids:
                    type: array
                    items:
                        type: integer
                name:
                    type: object
                    properties:
                        en:
                            type: string
                    additionalProperties:
                        type: string
                description:
                    type: object
                    properties:
                        en:
                            type: string
                    additionalProperties:
                        type: string
                visibility:
                    type: string
                    enum: [protected, private, public]
                    default: public
                status:
                    type: string
                    enum: [draft, live, closed]
                    default: draft
                reference_id:
                    type: string
                start_date:
                    type: string
                    format: date-time
                end_date:
                    type: string
                    format: date-time
                timezone:
                    type: string
                    example: Europe/Paris
                default_locale:
                    type: string
                    writeOnly: true
                    example: fr
                replay:
                    type: boolean
                available_locales:
                    type: array
                    items:
                        type: string
                        example: fr
                venue:
                    type: object
                    properties:
                        name:
                            type: string
                        address:
                            type: string
                        city:
                            type: string
                        postcode:
                            type: string
                        country_code:
                            type: string
                            example: FR
                        latitude:
                            type: string
                        longitude:
                            type: string
                website:
                    $ref: '#/components/schemas/Website'
                urls:
                    type: object
                    readOnly: true
                    properties:
                        admin:
                            type: string
                            example: 'https://#'
                        website:
                            type: string
                            example: 'https://evdr.co/#'
                        web_app:
                            type: string
                            example: 'https://#'
        Session:
            type: object
            required:
                - name
                - start_date
                - end_date
                - visibility
            properties:
                id:
                    type: integer
                    format: int32
                external_id:
                    type: string
                name:
                    type: object
                    properties:
                        en:
                            type: string
                    additionalProperties:
                        type: string
                description:
                    type: object
                    properties:
                        en:
                            type: string
                    additionalProperties:
                        type: string
                visibility:
                    type: string
                    enum: [everyone, only_attendee_groups, registered_attendees]
                has_waiting_list:
                    type: boolean
                start_date:
                    type: string
                    format: date-time
                    example: '2025-11-07 08:00:00'
                end_date:
                    type: string
                    format: date-time
                    example: '2025-11-07 09:00:00'
                max_capacity:
                    type: integer
                    format: int32
                    nullable: true
                registered_attendee_count:
                    type: integer
                    format: int32
                    readOnly: true
                    description: Number of attendees registered to this session
                child_ids:
                    type: array
                    items:
                        type: integer
                        format: int32
                    readOnly: true
                    description: IDs of child sessions (sessions where parent_id equals this session's ID)
                child_external_ids:
                    type: array
                    items:
                        type: string
                    readOnly: true
                    description: External IDs of child sessions (sessions where parent_id equals this session's ID)
        EventList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Event'
                total_count:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
                current_page:
                    type: integer
                    format: int32
                next_page_url:
                    type: string
                    format: uri
                prev_page_url:
                    type: string
                    format: uri
                first_page_url:
                    type: string
                    format: uri
                last_page_url:
                    type: string
                    format: uri
        SessionList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Session'
                total_count:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
                current_page:
                    type: integer
                    format: int32
                next_page_url:
                    type: string
                    format: uri
                prev_page_url:
                    type: string
                    format: uri
                first_page_url:
                    type: string
                    format: uri
                last_page_url:
                    type: string
                    format: uri
        AttendeeList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attendee'
                total_count:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
                current_page:
                    type: integer
                    format: int32
                next_page_url:
                    type: string
                    format: uri
                prev_page_url:
                    type: string
                    format: uri
                first_page_url:
                    type: string
                    format: uri
                last_page_url:
                    type: string
                    format: uri
        AttendeeEventList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        allOf:
                            - $ref: '#/components/schemas/Attendee'
                            - $ref: '#/components/schemas/EventAttendee'
        Member:
            type: object
            required:
                - first_name
                - last_name
                - email
                - company
            properties:
                id:
                    type: integer
                    format: int32
                    readOnly: true
                external_id:
                    type: string
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                    format: email
                password:
                    type: string
                    writeOnly: true
                phone_number:
                    type: string
                company:
                    type: string
                job_title:
                    type: string
                location:
                    type: string
                locale:
                    type: string
                    example: fr
                timezone:
                    type: string
                    example: Europe/Paris
                country_code:
                    type: string
                    example: FR
                active_event_short_url:
                    type: string
                    readOnly: true
        MembersList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Member'
                total_count:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
                current_page:
                    type: integer
                    format: int32
                next_page_url:
                    type: string
                    format: uri
                prev_page_url:
                    type: string
                    format: uri
                first_page_url:
                    type: string
                    format: uri
                last_page_url:
                    type: string
                    format: uri
        EventAttendee:
            type: object
            properties:
                specific_attributes:
                    type: array
                    readOnly: true
                    items:
                        type: object
                        properties:
                            name:
                                type: string
                                example: 'First registration form'
                            label:
                                type: string
                                example: 'first_form'
                            created_at:
                                type: string
                                format: date-time
                            attributes:
                                type: object
                                additionalProperties:
                                    type: string
                registration:
                    type: object
                    properties:
                        registration_status:
                            type: string
                            enum:
                                - none
                                - invited
                                - pre_registered
                                - confirmed
                                - refused
                        registration_status_updated_at:
                            type: string
                            format: date-time
                            readOnly: true
                        checked_in:
                            type: boolean
                        checked_in_at:
                            type: string
                            format: date-time
                            readOnly: true
                forms:
                    type: object
                    readOnly: true
                    description: 'Every form labels of the event. True if the form was submitted by the attendee.'
                    additionalProperties:
                        type: boolean
                urls:
                    type: object
                    readOnly: true
                    properties:
                        confirm:
                            type: string
                            example: 'https://evdr.co/#'
                        decline:
                            type: string
