openapi: 3.0.0
info:
    version: 1.0.0
    title: Eventdrive API
servers:
    - url: https://api.eventdrive.com/public/v1/
      description: Production server (uses live data)
    - url: https://api.dev.eventdrive.com/public/v1/
      description: Sandbox server (uses test data)
paths:
    /token:
        post:
            tags:
                - token
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            properties:
                                client_id:
                                    type: string
                                    description: Client ID
                                client_secret:
                                    type: string
                                    description: Client Secret
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                properties:
                                    access_token:
                                        type: string
                                        format: bearer
                                    token_type:
                                        type: string
                                    expires_in:
                                        type: integer
                                        format: int32
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
    /organization:
        get:
            tags:
                - Organization
            summary: Retrieve organization
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Organization'
                403:
                    $ref: '#/components/responses/403'
    /events:
        get:
            tags:
                - Events
            summary: Retrieve all events
            parameters:
                - $ref: '#/components/parameters/perPage'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventList'
                403:
                    $ref: '#/components/responses/403'
        post:
            tags:
                - Events
            summary: Add a new event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Event'
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Event'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'

    /events/{eventId}:
        get:
            tags:
                - Events
            summary: Retrieve an event
            parameters:
                - $ref: '#/components/parameters/eventId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Event'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        put:
            tags:
                - Events
            summary: Update an event
            parameters:
                - $ref: '#/components/parameters/eventId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Event'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Event'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        delete:
            tags:
                - Events
            parameters:
                - $ref: '#/components/parameters/eventId'
            summary: Delete an event
            responses:
                200:
                    description: OK
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
    /events/{eventId}/sessions:
        get:
            tags:
                - Events Sessions
            summary: Retrieve event sessions
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/perPage'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionList'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        post:
            tags:
                - Events Sessions
            summary: Add a new session
            parameters:
                - $ref: '#/components/parameters/eventId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Session'
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Session'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
    /events/{eventId}/sessions/{sessionId}:
        get:
            tags:
                - Events Sessions
            summary: Retrieve a session
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/sessionId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Session'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        put:
            tags:
                - Events Sessions
            summary: Update a session
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/sessionId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Session'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Session'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        delete:
            tags:
                - Events Sessions
            summary: Delete a session
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/sessionId'
            responses:
                200:
                    description: OK
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'

    /events/{eventId}/attendees:
        get:
            tags:
                - Events Attendees
            summary: Retrieve event attendees
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/perPage'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttendeeEventList'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
    /events/{eventId}/attendees/{attendeeId}:
        get:
            tags:
                - Events Attendees
            summary: Retrieve an event attendee using Id
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventAttendeeRequestBody'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Attendee'
                                    - $ref: '#/components/schemas/EventAttendee'
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Attendee'
                                    - $ref: '#/components/schemas/EventAttendee'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        put:
            tags:
                - Events Attendees
            summary: Add or update an attendee to an event using Id
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventAttendeeRequestBody'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Attendee'
                                    - $ref: '#/components/schemas/EventAttendee'
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Attendee'
                                    - $ref: '#/components/schemas/EventAttendee'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        post:
            tags:
                - Events Attendees
            summary: Add attendee to event
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EventAttendeeRequestBody'
            responses:
                200:
                    description: OK
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        delete:
            tags:
                - Events Attendees
            summary: Remove an attendee from event
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
            responses:
                200:
                    description: OK
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'

    /events/{eventId}/attendees/{attendeeId}/sessions:
        get:
            tags:
                - Attendee Sessions
            summary: Retrieve attendee session registrations
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttendeeSessionList'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'

    /events/{eventId}/attendees/{attendeeId}/sessions/{sessionId}:
        get:
            tags:
                - Attendee Sessions
            summary: Get attendee session registration
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
                - $ref: '#/components/parameters/sessionId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttendeeSession'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        post:
            tags:
                - Attendee Sessions
            summary: Register attendee to session
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
                - $ref: '#/components/parameters/sessionId'
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttendeeSession'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        put:
            tags:
                - Attendee Sessions
            summary: Update attendee session registration
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
                - $ref: '#/components/parameters/sessionId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttendeeSession'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        delete:
            tags:
                - Attendee Sessions
            summary: Unregister attendee from session
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/attendeeId'
                - $ref: '#/components/parameters/sessionId'
            responses:
                200:
                    description: OK
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'

    /events/{eventId}/emails:
        get:
            tags:
                - Events Mails
            summary: Retrieve event mails
            parameters:
                - $ref: "#/components/parameters/eventId"
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MailList"
                403:
                    $ref: "#/components/responses/403"
                404:
                    $ref: "#/components/responses/404"

    /events/{eventId}/emails/{mailId}/send:
        post:
            tags:
                - Events Mails
            summary: Send an mail using event id, mail id and attendee ids
            parameters:
                - $ref: "#/components/parameters/eventId"
                - $ref: "#/components/parameters/mailId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                attendee_ids:
                                    type: array
                                    items:
                                        type: integer
                                        example: 1,2,3
            responses:
                200:
                    $ref: "#/components/responses/200"
                400:
                    $ref: "#/components/responses/400"
                403:
                    $ref: "#/components/responses/403"

    /events/{eventId}/emails/{emailInternalName}/send:
        post:
            tags:
                - Events Mails
            summary: Send an mail using event id, confirmation internal name and attendee ids
            parameters:
                - $ref: "#/components/parameters/eventId"
                - $ref: "#/components/parameters/emailInternalName"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                attendee_ids:
                                    type: array
                                    items:
                                        type: integer
                                        example: 1,2,3
            responses:
                200:
                    $ref: "#/components/responses/200"
                400:
                    $ref: "#/components/responses/400"
                403:
                    $ref: "#/components/responses/403"


    /events/{eventExternalId}/emails/{emailInternalName}/send:
        post:
            tags:
                - Events Mails
            summary: Send an mail using event external id confirmation internal name and attendee external ids
            parameters:
                - $ref: '#/components/parameters/useExternalId'
                - $ref: '#/components/parameters/eventExternalId'
                - $ref: "#/components/parameters/emailInternalName"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                attendee_external_ids:
                                    type: array
                                    items:
                                        type: string
                                        example: abcd1234,efgh5678,ijkl91011
            responses:
                200:
                    $ref: "#/components/responses/200"
                400:
                    $ref: "#/components/responses/400"
                403:
                    $ref: "#/components/responses/403"

    /events/{eventId}/ticketing/orders:
        get:
            tags:
                - Events Ticketing Orders
            summary: Retrieve all orders from an event
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/perPage'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketingOrdersList'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        post:
            tags:
                - Events Ticketing Orders
            summary: Add an order to an event
            parameters:
                - $ref: '#/components/parameters/eventId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TicketingOrder'
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketingOrder'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'

    /events/{eventId}/ticketing/orders/{orderId}:
        get:
            tags:
                - Events Ticketing Orders
            summary: Retrieve an order from an event
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/ticketingOrderId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketingOrder'
                403:
                    $ref: '#/components/responses/403'
        put:
            tags:
                - Events Ticketing Orders
            summary: Add or update an order from an event
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/ticketingOrderId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TicketingOrder'
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketingOrder'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
        delete:
            tags:
                - Events Ticketing Orders
            summary: Delete an order from an event
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/ticketingOrderId'
            responses:
                200:
                    description: OK
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
    /events/{eventId}/ticketing/{orderId}/items:
        get:
            tags:
                - Events Ticketing Orders Items
            summary: Retrieve all items from an order of an event
            parameters:
                - $ref: '#/components/parameters/eventId'
                - $ref: '#/components/parameters/ticketingOrderId'
                - $ref: '#/components/parameters/perPage'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketingOrderItemsList'
                403:
                    $ref: '#/components/responses/403'
    /events/{eventId}/ticketing/{orderId}/items/{itemId}:
        get:
            tags:
                - Events Ticketing Orders Items
            summary: Retrieve an item from an order of an event
            parameters:
               - $ref: '#/components/parameters/eventId'
               - $ref: '#/components/parameters/ticketingOrderId'
               - $ref: '#/components/parameters/ticketingItemId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketingOrderItem'
                403:
                    $ref: '#/components/responses/403'
        delete:
            tags:
                - Events Ticketing Orders Items
            summary: Remove an item from an order of an event
            parameters:
               - $ref: '#/components/parameters/eventId'
               - $ref: '#/components/parameters/ticketingOrderId'
               - $ref: '#/components/parameters/ticketingItemId'
            responses:
                200:
                    description: OK
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
    /attendees:
        get:
            tags:
                - Attendees
            summary: Retrieve all attendees
            parameters:
                - $ref: '#/components/parameters/perPage'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttendeeList'
                403:
                    $ref: '#/components/responses/403'
        post:
            tags:
                - Attendees
            summary: Add a new attendee
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Attendee'
            responses:
                201:
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Attendee'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
    /attendees/{attendeeId}:
        get:
            tags:
                - Attendees
            summary: Retrieve an attendee
            parameters:
                - $ref: '#/components/parameters/attendeeId'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Attendee'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        put:
            tags:
                - Attendees
            summary: Update an attendee
            parameters:
                - $ref: '#/components/parameters/attendeeId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Attendee'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Attendee'
                400:
                    $ref: '#/components/responses/400'
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
        delete:
            tags:
                - Attendees
            summary: Delete an attendee
            parameters:
                - $ref: '#/components/parameters/attendeeId'
            responses:
                200:
                    description: OK
                403:
                    $ref: '#/components/responses/403'
                404:
                    $ref: '#/components/responses/404'
    /events/{eventId}/groups:
      get:
        tags:
          - Groups
        summary: Retrieve groups
        parameters:
          - $ref: "#/components/parameters/eventId"
        responses:
          200:
            description: OK
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/GroupsList"
          403:
            $ref: "#/components/responses/403"
          404:
            $ref: "#/components/responses/404" 
      post:
        tags:
          - Groups
        summary: Add a new group
        parameters:
          - $ref: "#/components/parameters/eventId"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        responses:
          200:
            description: OK
          400:
            $ref: "#/components/responses/400"
          403:
            $ref: "#/components/responses/403"
          404:
            $ref: "#/components/responses/404"
    /events/{eventId}/groups/{groupId}:
      get:
        tags:
          - Groups
        summary: Retrieve a group
        parameters:
          - $ref: "#/components/parameters/eventId"
          - $ref: "#/components/parameters/groupId"
        responses:
          200:
            description: OK
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Group"
          403:
            $ref: "#/components/responses/403"
          404:
            $ref: "#/components/responses/404"
      put:
        tags:
          - Groups
        summary: Update a group
        parameters:
          - $ref: "#/components/parameters/eventId"
          - $ref: "#/components/parameters/groupId"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        responses:
          200:
            description: OK
          400:
            $ref: "#/components/responses/400"
          403:
            $ref: "#/components/responses/403"
          404:
            $ref: "#/components/responses/404"
      delete:
        tags:
          - Groups
        summary: Remove a group
        parameters:
          - $ref: "#/components/parameters/eventId"
          - $ref: "#/components/parameters/groupId"
        responses:
          200:
            description: OK
          403:
            $ref: "#/components/responses/403"
          404:
            $ref: "#/components/responses/404"
    /events/{eventId}/groups/{groupId}/attendees:
      get:
        tags:
          - Groups
        summary: Retrieve attendees in group
        parameters:
          - $ref: "#/components/parameters/eventId"
          - $ref: "#/components/parameters/groupId"
        responses:
          200:
            description: OK
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/GroupAttendeesList"
          403:
            $ref: "#/components/responses/403"
          404:
            $ref: "#/components/responses/404"   
    /events/{eventId}/groups/{groupId}/attendees/{attendeeId}:
      put:
        tags:
          - Groups
        summary: Add an attendee to a group
        parameters:
          - $ref: "#/components/parameters/eventId"
          - $ref: "#/components/parameters/groupId"
          - $ref: "#/components/parameters/attendeeId"
        responses:
          200:
